# m3 (HA-WFE v2 + CLIP 雾提示 + HazeCLIP 教师蒸馏)
model:
  version: m3
  backbone: s

data:
  root: ${ICEWAVE_DATA_ROOT}/dataset
  patch_size: 192

train:
  epochs: 30
  batch_size: 4
  lr: 1.0e-4
  prompt_drop_prob: 0.5
  train_prompt_proj: true

losses:
  lambda_l1: 1.0
  lambda_ssim: 0.1
  lambda_kd: 0.05
