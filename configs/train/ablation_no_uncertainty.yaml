# 消融实验 2: 固定权重 (关闭不确定性加权, s_clamp=[0,0])
# s_clamp=[0,0] 强制 s=0, 即所有损失权重固定为 lambda_*, 不学习
model:
  version: joint_v2
  backbone: s
  init_checkpoint: null
  detector_weights: null

data:
  root: data/synthetic_full
  patch_size: 128
  with_bboxes: true

train:
  batch_size: 4
  num_workers: 0
  prompt_drop_prob: 1.0
  stages:
    warm_up:
      epochs: 8
      lr: 1.0e-4
    joint:
      epochs: 40
      lr: 5.0e-5
      grad_clip: 10.0

losses:
  K: 5
  lambda_recon_l1: 1.0
  lambda_recon_ssim: 0.1
  lambda_box_feat: 0.5
  lambda_detect: 0.2
  lambda_box_align: 0.5
  lambda_ice_phys: 0.3
  box_feat_type: detector
  detect_tau_cls: 0.01
  s_init: 0.0
  s_clamp: [0.0, 0.0]  # ← 消融: 固定权重, s 不能偏移
