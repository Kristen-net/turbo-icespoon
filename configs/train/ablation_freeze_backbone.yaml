# 消融实验 3: 冻结去雾主干 (encoder layers 1-3 + patch_embed + merges)
# 文档 W5: "冻结主干" 消融 - Stage-B 冻结编码器, 仅微调解码器+hawfe+head
# 测试编码器联合优化是否必要
model:
  version: joint_v2
  backbone: s
  init_checkpoint: null
  detector_weights: null

data:
  root: data/synthetic_full
  patch_size: 128
  with_bboxes: true

train:
  batch_size: 4
  num_workers: 0
  prompt_drop_prob: 1.0
  freeze_dehaze_backbone: true  # ← 消融: Stage-B 冻结编码器
  stages:
    warm_up:
      epochs: 8
      lr: 1.0e-4
    joint:
      epochs: 40
      lr: 5.0e-5
      grad_clip: 10.0

losses:
  K: 5
  lambda_recon_l1: 1.0
  lambda_recon_ssim: 0.1
  lambda_box_feat: 0.5
  lambda_detect: 0.2
  lambda_box_align: 0.5
  lambda_ice_phys: 0.3
  box_feat_type: detector
  detect_tau_cls: 0.01
  s_init: 0.0
  s_clamp: [-6.0, 6.0]
