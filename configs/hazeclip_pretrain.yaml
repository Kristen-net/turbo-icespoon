# ⚠️ 历史遗留配置 (审计编号 M3)
#
# 此文件来自旧版 HazeCLIP 预训练流程 (源仓 source_hazeclip/), 与新版
# IceWave-DehazeFormer 的训练入口 icewave-train 不兼容.
#
# 新版训练请使用:
#   icewave-train --config configs/train/m3.yaml
#
# 本文件保留仅为追溯, 不会随 pip install -e . 一起被加载.
# 详见 docs/AUDIT_REPORT.md (2026-09).
# ---------------------------------------------------------------------------
data:
  crop_size: 256
  gt_folder: "./data/RIDCP/rgb_500/"
  depth_folder: "./data/RIDCP/depth_500/"

train:
  lr: 3e-5
  batch_size: 24
  num_epochs: 200
  exp_dir: "./experiment/pretrain/"