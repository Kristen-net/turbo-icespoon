name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:

# P0-2c 重构后: 按可选依赖分多条流水线, 默认 path 跑最快 (CI 主链路),
# detect path 需 ~600MB ultralytics, 单独跑且用 nightly smoke 避免慢测试.
# test-base 是其它 job 的前置 (needs: test-base).
jobs:
  test-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install (no extras)
        run: pip install -e .
      - name: Install pytest (test runner)
        # pytest 不在 [project] extras 中, 故 test-base job 显式安装.
        # 锁 pytest<9 + iniconfig<2: pytest 9.x + iniconfig 2.x 触发 SectionWrapper ImportError.
        run: pip install "pytest>=7.4,<9" "pytest-cov>=4.0,<7" "iniconfig>=1.0,<2"
      - name: Run tests
        run: pytest tests/ -q

  test-dev:
    runs-on: ubuntu-latest
    needs: test-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install [dev]
        run: pip install -e ".[dev]"
      - name: Run tests (full)
        run: pytest tests/ -v

  test-detect:
    # 仅跑 detect 包的烟雾测试 (test_detect_yolo 已设计为无需 ultralytics),
    # 避免在 CI 上下载 600MB ultralytics + 仍可验证 detect 模块代码路径正确。
    runs-on: ubuntu-latest
    needs: test-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install (core deps, no extras)
        # 用 `pip install -e .` 装核心 deps (timm/pyyaml/numpy/opencv...), 不装 detect 的
        # AGPL ultralytics(避免下载 600MB)。此前 `--no-deps` 导致核心导入缺依赖而 exit 1。
        run: pip install -e .
      - name: Install pytest (test runner)
        # 本 job 不装 [dev] extra, pytest 需显式安装; 锁 <9 避免 iniconfig 2.x ImportError.
        run: pip install "pytest>=7.4,<9" "iniconfig>=1.0,<2"
      - name: Detect smoke tests (no ultralytics required)
        run: pytest tests/test_detect_yolo.py -v

  test-clis:
    runs-on: ubuntu-latest
    needs: test-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install [train,quality]
        run: pip install -e ".[train,quality]"
      - name: Smoke-test CLIs
        run: |
          icewave-train --help
          icewave-infer --help
          icewave-eval-benchmark --help
          icewave-eval-downstream --help
          icewave-build-dataset --help
