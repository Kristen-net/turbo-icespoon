name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:

# P0-2c 重构后: 按可选依赖分两条流水线, 默认 path 跑最快 (CI 主链路),
# detect path 需 ~600MB ultralytics, 单独跑且用 nightly smoke 避免慢测试.
jobs:
  test-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install (no extras)
        run: pip install -e .
      - name: Install pytest (for tests/)
        # pytest 在 [dev] extra, test-base job 不装 extras, 故显式安装.
        # 锁定 pytest 8.x (避开 pytest 9.x + iniconfig 2.x 不兼容 bug).
        run: pip install "pytest>=7.4,<9" "pytest-cov>=4.0,<7" "iniconfig>=1.0,<2"
      - name: Run tests
        run: |
          echo "::group::Versions & imports"
          python -c "import sys, pytest, iniconfig, torch, numpy; print(f'python={sys.version.split()[0]} pytest={pytest.__version__} iniconfig={iniconfig.__version__} torch={torch.__version__} numpy={numpy.__version__}')"
          python -c "import icewave; print('icewave import OK')"
          echo "::endgroup::"
          pytest tests/ -v --tb=long 2>&1

  test-dev:
    runs-on: ubuntu-latest
    needs: test-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install [dev]
        run: pip install -e ".[dev]"
      - name: Run tests (full)
        run: pytest tests/ -v

  test-detect:
    # 仅跑 detect 包的烟雾测试 (test_detect_yolo 已设计为无需 ultralytics),
    # 避免在 CI 上下载 600MB ultralytics + 仍可验证 detect 模块代码路径正确。
    runs-on: ubuntu-latest
    needs: test-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install with [detect] extra (smoke import)
        run: pip install -e ".[detect]" --no-deps || true
        # --no-deps 因为 CI 已先装 torch + opencv; ultralytics 自带依赖装一次看是否可获取即可。
      - name: Detect smoke tests (no ultralytics required)
        run: pytest tests/test_detect_yolo.py -v

  test-clis:
    runs-on: ubuntu-latest
    needs: test-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install [train,quality]
        run: pip install -e ".[train,quality]"
      - name: Smoke-test CLIs
        run: |
          icewave-train --help
          icewave-infer --help
          icewave-eval-benchmark --help
          icewave-eval-downstream --help
          icewave-build-dataset --help
